name: Deploy Pre-Rendered Portfolio

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup GitHub Pages cloud server module
        uses: actions/configure-pages@v5

      - name: Upload static documentation folder assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy Live Interactive Web Showcase to Pages Grid
        id: deployment
        uses: actions/deploy-pages@v4
