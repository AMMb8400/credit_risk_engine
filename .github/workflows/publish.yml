name: Render and Publish Quarto Portfolio

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: actions/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            DBI
            RPostgres
            dplyr
            tidyr
            stringr
            lubridate
            readr
            dbplyr
            knitr
            mlr3
            mlr3learners
            mlr3tuning
            paradox
            ranger

      - name: Render Quarto Document
        uses: actions/quarto-actions/render@v2
        with:
          to: html
          execute-params: |
            output-file: index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
